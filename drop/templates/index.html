<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChimpDrop | Universal Web Clipboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #06080f;
            --surface: #0d1117;
            --card: #131920;
            --card-hover: #18202a;
            --border: #1e2a3a;
            --border-glow: #1a3a5c;
            --text: #e8ecf2;
            --text-muted: #8b9bb4;
            --accent: #22c997;
            --accent-dim: rgba(34,201,151,0.12);
            --accent-glow: rgba(34,201,151,0.25);
            --blue: #38bdf8;
            --blue-dim: rgba(56,189,248,0.12);
            --purple: #a78bfa;
            --purple-dim: rgba(167,139,250,0.12);
            --red: #f87171;
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        .navbar {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 1.15rem;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .nav-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn:hover {
            color: var(--text);
            border-color: var(--accent);
            background: var(--card-hover);
        }
        .container {
            max-width: 900px;
            margin: 28px auto;
            padding: 0 16px;
        }
        .drop-box {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .drop-box.dragover {
            border-color: var(--accent);
            background: rgba(34, 201, 151, 0.05);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .input-textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }
        .drop-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .btn:hover {
            background: var(--card-hover);
            border-color: var(--border-glow);
        }
        .btn-primary {
            background: var(--accent);
            color: #04100c;
            border-color: var(--accent);
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #2de2ab;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 28px 0 16px 0;
            flex-wrap: wrap;
            gap: 12px;
        }
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--surface);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .tab {
            padding: 6px 14px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--card);
            color: var(--text);
            font-weight: 600;
        }
        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px;
            color: var(--text);
            outline: none;
            font-size: 0.88rem;
            width: 200px;
        }
        .search-box:focus {
            border-color: var(--accent);
        }
        .clips-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .clip-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: all 0.2s;
            position: relative;
        }
        .clip-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-1px);
        }
        .clip-card.pinned {
            border-color: rgba(245, 158, 11, 0.4);
            background: rgba(245, 158, 11, 0.02);
        }
        .clip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .badge {
            font-size: 0.72rem;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge-url { background: var(--blue-dim); color: var(--blue); }
        .badge-code { background: var(--purple-dim); color: var(--purple); }
        .badge-text { background: var(--accent-dim); color: var(--accent); }
        .badge-file { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .badge-image { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
        .clip-time {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .clip-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text);
            word-break: break-word;
            white-space: pre-wrap;
        }
        .clip-content.code-view {
            font-family: 'JetBrains Mono', monospace;
            background: var(--card);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        .clip-url {
            color: var(--blue);
            text-decoration: underline;
        }
        .clip-image-preview {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid var(--border);
            object-fit: contain;
        }
        .clip-actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            justify-content: flex-end;
        }
        .icon-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .icon-btn:hover {
            color: var(--text);
            border-color: var(--accent);
        }
        .icon-btn.danger:hover {
            color: var(--red);
            border-color: var(--red);
        }
        .icon-btn.pinned-btn {
            color: #f59e0b;
        }
        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--card);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            transform: translateY(10px);
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* QR Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 340px;
            width: 90%;
            text-align: center;
        }
        .modal-card h3 { margin-bottom: 16px; font-size: 1.1rem; }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 16px auto;
            background: white;
            padding: 12px;
            border-radius: 8px;
            width: fit-content;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">
            <span>🐒</span>
            <span>ChimpDrop</span>
            <span style="font-size: 0.75rem; background: var(--accent-dim); color: var(--accent); padding: 2px 8px; border-radius: 12px; margin-left: 4px;">LAN</span>
        </a>
        <div class="nav-links">
            <a href="http://192.168.1.13:8080" class="nav-btn">🏠 Dashboard</a>
            <a href="http://192.168.1.13:8081" class="nav-btn">📁 Files</a>
            <a href="http://192.168.1.13:8091" class="nav-btn">📷 Photos</a>
        </div>
    </nav>

    <div class="container">
        <!-- Drop / Input Area -->
        <div class="drop-box" id="dropArea">
            <textarea id="clipInput" class="input-textarea" placeholder="Paste or type text, code, or link here... (or drag files anywhere, or press Ctrl+V to paste images)"></textarea>
            <input type="file" id="fileInput" style="display:none" multiple>
            <div class="drop-actions">
                <div class="action-group">
                    <button class="btn" onclick="document.getElementById('fileInput').click()">📎 Drop File</button>
                    <button class="btn" onclick="pasteFromClipboard()">📋 Paste</button>
                </div>
                <div class="action-group">
                    <span style="font-size:0.75rem; color:var(--text-muted); margin-right:4px;">Ctrl+Enter</span>
                    <button class="btn btn-primary" onclick="submitClip()">Save Clip 🚀</button>
                </div>
            </div>
        </div>

        <!-- Filter & Search -->
        <div class="filter-bar">
            <div class="tabs">
                <button class="tab active" data-filter="all" onclick="setFilter('all')">All</button>
                <button class="tab" data-filter="text" onclick="setFilter('text')">Text</button>
                <button class="tab" data-filter="url" onclick="setFilter('url')">Links</button>
                <button class="tab" data-filter="code" onclick="setFilter('code')">Code</button>
                <button class="tab" data-filter="file" onclick="setFilter('file')">Files</button>
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="text" class="search-box" id="searchBox" placeholder="Search clips..." oninput="renderClips()">
                <button class="icon-btn danger" onclick="clearUnpinned()" title="Clear unpinned clips">🧹 Clear</button>
            </div>
        </div>

        <!-- Clips Feed -->
        <div class="clips-list" id="clipsFeed">
            <div class="empty-state">Loading clips...</div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <!-- QR Code Modal -->
    <div class="modal" id="qrModal" onclick="closeQrModal(event)">
        <div class="modal-card">
            <h3>Scan with Phone Camera</h3>
            <div id="qrcode"></div>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">Instantly opens this content on your phone</p>
            <button class="btn" style="margin-top: 16px; width: 100%;" onclick="closeQrModal()">Close</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.pathname.startsWith('/drop') ? '/drop/api' : '/api';
        let allClips = [];
        let currentFilter = 'all';

        async function fetchClips() {
            try {
                const res = await fetch(`${API_BASE}/clips`);
                const data = await res.json();
                allClips = data.clips || [];
                renderClips();
            } catch (err) {
                console.error("Fetch clips error:", err);
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.filter === filter);
            });
            renderClips();
        }

        function renderClips() {
            const query = (document.getElementById('searchBox').value || '').toLowerCase();
            const feed = document.getElementById('clipsFeed');

            const filtered = allClips.filter(c => {
                const matchesFilter = (currentFilter === 'all') ||
                    (currentFilter === 'file' && (c.type === 'file' || c.type === 'image')) ||
                    (c.type === currentFilter);
                const matchesSearch = !query ||
                    (c.content && c.content.toLowerCase().includes(query)) ||
                    (c.filename && c.filename.toLowerCase().includes(query));
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                feed.innerHTML = `<div class="empty-state">No clips found. Type or paste above to save one!</div>`;
                return;
            }

            feed.innerHTML = filtered.map(c => {
                let badgeClass = `badge-${c.type}`;
                let contentHtml = '';

                if (c.type === 'url') {
                    contentHtml = `<a href="${c.content}" target="_blank" rel="noopener" class="clip-url">${escapeHtml(c.content)}</a>`;
                } else if (c.type === 'code') {
                    contentHtml = `<pre class="clip-content code-view"><code>${escapeHtml(c.content)}</code></pre>`;
                } else if (c.type === 'image') {
                    const imgUrl = `${API_BASE}/file/${encodeURIComponent(c.filename)}?name=${encodeURIComponent(c.original_name || c.content)}`;
                    contentHtml = `
                        <div style="font-weight: 500; font-size: 0.9rem;">${escapeHtml(c.content)} <span style="color:var(--text-muted); font-size: 0.75rem;">(${c.size_str})</span></div>
                        <img src="${imgUrl}" class="clip-image-preview" alt="Dropped Image" loading="lazy">
                    `;
                } else if (c.type === 'file') {
                    const fileUrl = `${API_BASE}/file/${encodeURIComponent(c.filename)}?download=1&name=${encodeURIComponent(c.original_name || c.content)}`;
                    contentHtml = `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span>📦</span>
                            <span style="font-weight:600;">${escapeHtml(c.content)}</span>
                            <span style="color:var(--text-muted); font-size:0.8rem;">(${c.size_str})</span>
                        </div>
                    `;
                } else {
                    contentHtml = `<div class="clip-content">${escapeHtml(c.content)}</div>`;
                }

                const isPinned = c.pinned;
                const copyPayload = (c.type === 'file' || c.type === 'image')
                    ? `${window.location.origin}${API_BASE}/file/${encodeURIComponent(c.filename)}`
                    : c.content;

                return `
                    <div class="clip-card ${isPinned ? 'pinned' : ''}">
                        <div class="clip-header">
                            <span class="badge ${badgeClass}">${c.type}</span>
                            <span class="clip-time">${c.created_str || ''}</span>
                        </div>
                        ${contentHtml}
                        <div class="clip-actions">
                            <button class="icon-btn ${isPinned ? 'pinned-btn' : ''}" onclick="togglePin('${c.id}')" title="Pin / Unpin">
                                ${isPinned ? '📌 Pinned' : '📍 Pin'}
                            </button>
                            <button class="icon-btn" onclick="copyText(${JSON.stringify(copyPayload)})" title="Copy Content">
                                📋 Copy
                            </button>
                            <button class="icon-btn" onclick="showQr(${JSON.stringify(copyPayload)})" title="Generate QR Code">
                                📱 QR
                            </button>
                            ${(c.type === 'file' || c.type === 'image') ? `
                                <a href="${API_BASE}/file/${encodeURIComponent(c.filename)}?download=1&name=${encodeURIComponent(c.original_name || c.content)}" class="icon-btn" style="text-decoration:none;">
                                    ⬇️ Download
                                </a>
                            ` : ''}
                            <button class="icon-btn danger" onclick="deleteClip('${c.id}')" title="Delete Clip">
                                🗑️
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function submitClip() {
            const input = document.getElementById('clipInput');
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(`${API_BASE}/clips`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    input.value = '';
                    fetchClips();
                    showToast('Clip saved!');
                }
            } catch (err) {
                console.error("Save error:", err);
            }
        }

        async function uploadFileObject(file) {
            const form = new FormData();
            form.append('file', file);
            showToast(`Uploading ${file.name}...`);
            try {
                const res = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: form
                });
                if (res.ok) {
                    showToast(`Uploaded ${file.name}!`);
                    fetchClips();
                } else {
                    showToast('Upload failed');
                }
            } catch (err) {
                console.error("Upload error:", err);
                showToast('Upload error');
            }
        }

        async function togglePin(id) {
            await fetch(`${API_BASE}/clips/${id}/pin`, { method: 'POST' });
            fetchClips();
        }

        async function deleteClip(id) {
            await fetch(`${API_BASE}/clips/${id}`, { method: 'DELETE' });
            fetchClips();
            showToast('Deleted');
        }

        async function clearUnpinned() {
            if (!confirm('Clear all unpinned clips?')) return;
            await fetch(`${API_BASE}/clear`, { method: 'POST' });
            fetchClips();
            showToast('Cleared unpinned clips');
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('clipInput').value = text;
                    document.getElementById('clipInput').focus();
                }
            } catch (err) {
                showToast('Clipboard access not allowed by browser');
            }
        }

        function copyText(str) {
            navigator.clipboard.writeText(str).then(() => {
                showToast('Copied to clipboard!');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = str;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Copied to clipboard!');
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        let qrcodeInstance = null;
        function showQr(text) {
            const modal = document.getElementById('qrModal');
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrcodeInstance = new QRCode(qrContainer, {
                text: text,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
            modal.classList.add('active');
        }

        function closeQrModal(e) {
            if (!e || e.target.id === 'qrModal' || e.target.tagName === 'BUTTON') {
                document.getElementById('qrModal').classList.remove('active');
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        // Global shortcuts & Paste event (images & files from clipboard!)
        window.addEventListener('paste', e => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    uploadFileObject(blob);
                    e.preventDefault();
                    return;
                }
            }
        });

        document.getElementById('clipInput').addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                submitClip();
            }
        });

        // Drag and drop handling
        const dropArea = document.getElementById('dropArea');
        ['dragenter', 'dragover'].forEach(name => {
            window.addEventListener(name, e => {
                e.preventDefault();
                dropArea.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach(name => {
            window.addEventListener(name, e => {
                e.preventDefault();
                dropArea.classList.remove('dragover');
            });
        });
        window.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                for (let file of files) {
                    uploadFileObject(file);
                }
            }
        });

        document.getElementById('fileInput').addEventListener('change', e => {
            const files = e.target.files;
            if (files && files.length > 0) {
                for (let file of files) {
                    uploadFileObject(file);
                }
                e.target.value = '';
            }
        });

        // Initialize & Poll every 3 seconds for real-time live sync
        fetchClips();
        setInterval(fetchClips, 3000);
    </script>
</body>
</html>
